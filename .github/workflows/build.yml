name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Выгрузка кода
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настройка Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Автопоиск проекта и сборка APK
        run: |
          echo "=== Файлы в репозитории ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          # Ищем папку, где реально лежит settings.gradle.kts
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ОШИБКА: Файлы проекта (settings.gradle.kts и папка app) еще не загружены в репозиторий!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Переходим в папку проекта: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Принимаем лицензии Android SDK и запускаем сборку
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          gradle assembleDebug --no-daemon --console=plain

      - name: Загрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
